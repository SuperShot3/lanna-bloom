<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">How to send flowers to Thailand</title>
  <desc id="desc">Four steps: choose flowers, add recipient details, pay online, delivery in Thailand</desc>
  <rect width="960" height="220" fill="#FDFCF8"/>
  <defs>
    <style>
      .box { fill: #fff; stroke: #d6cfc4; stroke-width: 1.5; }
      .num { fill: #2f4a3a; font: 700 18px Georgia, serif; }
      .lab { fill: #3d342c; font: 600 14px system-ui, sans-serif; }
      .sub { fill: #6b635a; font: 400 12px system-ui, sans-serif; }
      .arr { fill: none; stroke: #b8a99a; stroke-width: 2; }
    </style>
  </defs>
  <g transform="translate(24,36)">
    <rect class="box" width="190" height="148" rx="12"/>
    <circle cx="28" cy="28" r="16" fill="#2f4a3a"/>
    <text class="num" x="28" y="34" text-anchor="middle" fill="#FDFCF8">1</text>
    <text class="lab" x="95" y="78" text-anchor="middle">Choose flowers</text>
    <text class="sub" x="95" y="100" text-anchor="middle">Browse real bouquets</text>
  </g>
  <path class="arr" d="M222 110 H248" marker-end="url(#a)"/>
  <g transform="translate(258,36)">
    <rect class="box" width="190" height="148" rx="12"/>
    <circle cx="28" cy="28" r="16" fill="#2f4a3a"/>
    <text class="num" x="28" y="34" text-anchor="middle" fill="#FDFCF8">2</text>
    <text class="lab" x="95" y="78" text-anchor="middle">Recipient details</text>
    <text class="sub" x="95" y="100" text-anchor="middle">Name, phone, Maps pin</text>
  </g>
  <path class="arr" d="M456 110 H482"/>
  <g transform="translate(492,36)">
    <rect class="box" width="190" height="148" rx="12"/>
    <circle cx="28" cy="28" r="16" fill="#2f4a3a"/>
    <text class="num" x="28" y="34" text-anchor="middle" fill="#FDFCF8">3</text>
    <text class="lab" x="95" y="78" text-anchor="middle">Pay online</text>
    <text class="sub" x="95" y="100" text-anchor="middle">International card</text>
  </g>
  <path class="arr" d="M690 110 H716"/>
  <g transform="translate(726,36)">
    <rect class="box" width="210" height="148" rx="12"/>
    <circle cx="28" cy="28" r="16" fill="#2f4a3a"/>
    <text class="num" x="28" y="34" text-anchor="middle" fill="#FDFCF8">4</text>
    <text class="lab" x="105" y="78" text-anchor="middle">Delivery in Thailand</text>
    <text class="sub" x="105" y="100" text-anchor="middle">Local florist fulfilment</text>
  </g>
</svg>
